# Alert rules, evaluated by Prometheus (visible at http://localhost:9090/alerts).
# No Alertmanager in this project: the rules document the thresholds and show firing state.
groups:
  - name: churn-api
    rules:
      - alert: ApiDown
        expr: up{job="churn-api"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "Churn API is not reachable by Prometheus"

      - alert: ModelNotLoaded
        expr: ael_model_loaded == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "The API is up but has no model (see container logs)"

      - alert: HighServerErrorRate
        expr: >
          sum(rate(ael_http_requests_total{status=~"5.."}[5m]))
          / sum(rate(ael_http_requests_total[5m])) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "More than 5% of requests are failing with 5xx"

      - alert: HighLatencyP95
        expr: >
          histogram_quantile(0.95,
            sum by (le) (rate(ael_http_request_duration_seconds_bucket{path="/predict"}[5m]))) > 0.5
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "p95 latency of /predict is above 500 ms"

      - alert: PredictionMixShift
        # Share of "Yes" predictions over the last 30 minutes far from the training positive rate
        # (about 27% at threshold 0.5 on Telco). A coarse early signal; real drift tests are Phase 7.
        expr: >
          (sum(increase(ael_predictions_total{prediction="Yes"}[30m]))
           / clamp_min(sum(increase(ael_predictions_total[30m])), 1)) > 0.6
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "More than 60% of recent predictions are churn: possible input drift"
