# Global defaults. Values here are overridden by experiment-specific configs.
project:
  name: ai-experiment-lab
  random_seed: 42

dataset:
  name: telco_churn
  file: Telco-Customer-Churn.csv     # looked up in the data directory (Drive folder in Colab)
  target: Churn
  task: classification               # classification | regression
  id_columns: [customerID]           # excluded from features
  positive_label: "Yes"               # class encoded as 1 (the class we want to detect)

split:
  test_size: 0.2
  stratify: true

validation:
  max_missing_fraction: 0.30         # per column
  max_duplicate_fraction: 0.05
  min_class_fraction: 0.05           # below this, warn about severe imbalance
  min_rows: 50                       # fewer rows than this is rejected

preprocessing:
  coerce_numeric: [TotalCharges]     # numbers stored as text; blanks become missing
  numeric_impute_strategy: median
  categorical_impute_strategy: most_frequent

selection:
  primary_metric: f1                 # see ADR-003 for rationale; revisit in Phase 1
  higher_is_better: true

tracking:
  experiment_name: telco-churn
  tracking_uri: null                 # null = use MLFLOW_TRACKING_URI (Colab setup cell sets the Drive SQLite store; ADR-001)

# Hyperparameter tuning (trial counts and search spaces): configs/tuning.yaml (ADR-004)
