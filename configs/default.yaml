# Global defaults. Values here are overridden by experiment-specific configs.
project:
  name: ai-experiment-lab
  random_seed: 42

dataset:
  name: telco_churn
  path: data/raw/telco_churn.csv     # in Colab this resolves under the Drive data directory
  target: Churn
  task: classification               # classification | regression
  id_columns: [customerID]           # excluded from features

split:
  test_size: 0.2
  stratify: true

validation:
  max_missing_fraction: 0.30         # per column
  max_duplicate_fraction: 0.05
  min_class_fraction: 0.05           # below this, warn about imbalance

selection:
  primary_metric: f1                 # see ADR-003 for rationale; revisit in Phase 1
  higher_is_better: true

tracking:
  experiment_name: telco-churn
  tracking_uri: null                 # set per environment; see ADR-001
