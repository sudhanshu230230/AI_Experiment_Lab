# Candidate models. Phase 1 starts with the first three.
classification:
  logistic_regression:
    params: { max_iter: 1000, class_weight: balanced }
  random_forest:
    params: { n_estimators: 300, class_weight: balanced, n_jobs: -1 }
  xgboost:
    params: { n_estimators: 300, learning_rate: 0.1, max_depth: 6 }
